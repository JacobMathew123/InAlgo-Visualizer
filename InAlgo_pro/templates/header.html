{% load static %}
<header class="site-header bg-dark text-white py-3">
    <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
        <a class="d-flex align-items-center text-white text-decoration-none" href="{% url 'home' %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-strava me-2" viewBox="0 0 16 16">
                <path d="M6.731 0 2 9.125h2.788L6.73 5.497l1.93 3.628h2.766zm4.694 9.125-1.372 2.756L8.66 9.125H6.547L10.053 16l3.484-6.875z"/>
            </svg>
            <span class="fs-5 fw-semibold">InAlgo Visualizer</span>
        </a>
        <nav class="d-flex gap-3 align-items-center">
            {% if request.user.is_authenticated %}
                <span class="text-white">Hi {{ request.user.first_name|default:request.user.username }}</span>
                <a class="text-white text-decoration-none" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="text-white text-decoration-none" href="{% url 'login_view' %}">Sign In</a>
            {% endif %}
        </nav>
    </div>
</header>
